<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Debug Editor</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 2rem;
            background: #0B1C18;
            color: white;
        }
        .box {
            background: white;
            color: black;
            padding: 2rem;
            margin: 2rem 0;
            border-radius: 8px;
        }
        h1 { color: #FF8C1A; }
    </style>
</head>
<body>
    <h1>🔍 Debug Editor</h1>
    <p class="subtitle">Verifica del caricamento dello script</p>
    
    <div class="box">
        <h2>Test 1: Script Inline</h2>
        <p>Questo pulsante è creato con JavaScript inline</p>
    </div>

    <script>
        console.clear();
        console.log('%c=== GRANFO EDITOR DEBUG ===', 'color: #FF8C1A; font-weight: bold; font-size: 14px;');
        console.log('📍 Hostname:', window.location.hostname);
        console.log('🔗 Protocol:', window.location.protocol);
        console.log('📄 URL:', window.location.href);
        console.log('⏱️ Document Ready State:', document.readyState);
        
        // Test 1: Crea il pulsante direttamente
        console.log('\n📝 Creando pulsante inline...');
        const btn = document.createElement('button');
        btn.id = 'test-button-inline';
        btn.innerHTML = '🧪 TEST BUTTON';
        btn.style.cssText = `
            position: fixed;
            bottom: 20px;
            right: 20px;
            background: #FF8C1A;
            color: white;
            border: none;
            padding: 1rem 1.5rem;
            border-radius: 50px;
            cursor: pointer;
            font-weight: 700;
            font-size: 1rem;
            z-index: 999999;
        `;
        btn.onclick = () => alert('Test Button Works! ✅');
        document.body.appendChild(btn);
        console.log('✅ Pulsante test creato');
    </script>
    
    <script>
        console.log('\n📄 Caricando granfo-visual-editor.js...');
        console.log('⏰ Timestamp:', Date.now());
    </script>
    <script src="granfo-visual-editor.js"></script>
    <script>
        console.log('\n✅ Script caricato');
        console.log('🔍 window.granfoEditor:', window.granfoEditor);
        if (window.granfoEditor) {
            console.log('✅ Editor trovato!');
            console.log('   isActive:', window.granfoEditor.isActive);
            console.log('   changes:', window.granfoEditor.changes.length);
        } else {
            console.error('❌ Editor NON trovato');
        }
        
        // Verifica pulsante
        setTimeout(() => {
            const btn = document.getElementById('granfo-editor-toggle');
            console.log('\n🔘 Ricerca pulsante editor:');
            console.log('   #granfo-editor-toggle:', btn ? '✅ TROVATO' : '❌ NON TROVATO');
            if (btn) {
                console.log('   Testo:', btn.innerHTML);
                console.log('   Posizione:', btn.style.position);
                console.log('   Display:', btn.style.display);
            }
        }, 1000);
    </script>
</body>
</html>
